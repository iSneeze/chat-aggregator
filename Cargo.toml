[workspace]
resolver = "3"
members = ["crates/*"]
# Built by a plain `cargo build`/`cargo test` in the root. The desktop app
# (crates/chat-app) is left out on purpose: GPUI adds ~850 crates to the
# build. Include it with `-p chat-app` or `--workspace`. New library crates
# must be added here too.
default-members = [
    "crates/chat-core",
    "crates/chat-engine",
    "crates/chat-render",
    "crates/chat-rplay",
    "crates/chat-server",
    "crates/chat-twitch",
    "crates/chat-youtube",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1"
serde_json = "1"
minijinja = "2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = { version = "1", features = ["chrono04"] }
oauth2 = { version = "5", default-features = false }
keyring = "4"
webbrowser = "1"
directories = "6"
chrono-tz = "0.10"
toml = "1"
# The overlay's Content-Security-Policy hash. Same versions the OAuth crate
# already brings in, so nothing is compiled twice.
sha2 = "0.10"
base64 = "0.22"
# Pinned exactly: the app is written against this version's API (GPUI
# changes a lot between releases).
gpui-kit = "=0.6.6"
