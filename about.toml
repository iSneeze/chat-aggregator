# cargo-about: collects the license texts of everything the desktop app is
# built from into THIRD-PARTY-LICENSES.html, which ships next to the program
# (their licenses require that), see .github/workflows/release.yml:
#
#   cargo about generate -m crates/chat-app/Cargo.toml about.hbs > THIRD-PARTY-LICENSES.html
#
# A dependency under any license not listed here stops it with an error: a
# check that nothing with stricter terms slips in unnoticed. Where a crate
# offers a choice ("MIT OR Apache-2.0"), the first accepted one is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots: Mozilla's list of trusted certificates.
    "CDLA-Permissive-2.0",
    # option-ext (through `directories`): file-level copyleft, which only
    # matters for changes to its own files. We use it unchanged.
    "MPL-2.0",
]

# The platforms there are builds for: platform-only dependencies (Windows
# APIs, Wayland, ...) are included.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Tests and build scripts don't end up in the program.
ignore-dev-dependencies = true
ignore-build-dependencies = true
