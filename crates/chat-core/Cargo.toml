[package]
name = "chat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jiff.workspace = true
serde.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The OS keyring for secrets, and the per-OS config dir for the
# keyring-less fallback (`secrets`).
keyring.workspace = true
directories.workspace = true
# Only for generating the API's JSON Schema (docs/schema/), not in normal builds.
schemars = { workspace = true, optional = true }

[features]
# Derives `schemars::JsonSchema` for the public event types.
schema = ["dep:schemars"]

[dev-dependencies]
serde_json.workspace = true
