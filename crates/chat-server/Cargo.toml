[package]
name = "chat-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
chat-render = { path = "../chat-render" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
# Downloads avatars for the overlay (see `avatars`).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# Paused, fast-forwarding clock for exact timing tests (`start_paused`);
# test builds only.
tokio = { workspace = true, features = ["test-util"] }
jiff.workspace = true
# A WebSocket client for the API's tests.
tokio-tungstenite.workspace = true
# The schema test (tests/api_schema.rs) needs the JSON Schema derives, which
# chat-core only compiles with this feature: tests only, not normal builds.
chat-core = { path = "../chat-core", features = ["schema"] }
schemars.workspace = true
