<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Preview – chat-aggregator</title>
<style>
  :root {
    --ui-bg: #111218;
    --ui-surface: #1a1c26;
    --ui-border: #2c3040;
    --ui-text: #eef0f6;
    --ui-muted: #98a0b3;
    --ui-accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ui-bg);
    color: var(--ui-text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    padding: 10px 16px;
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
  }
  .title {
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
  }
  .pill {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgb(124 92 255 / 0.18);
    color: #c8b8ff;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .group__label {
    font-size: 12px;
    color: var(--ui-muted);
  }
  .seg {
    display: inline-flex;
    padding: 2px;
    gap: 2px;
    border-radius: 8px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
  }
  button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ui-muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  button:hover { color: var(--ui-text); }
  button.is-active {
    background: var(--ui-accent);
    color: #ffffff;
  }
  button.action {
    border: 1px solid var(--ui-border);
    background: var(--ui-bg);
    color: var(--ui-text);
  }
  button.action:hover {
    border-color: var(--ui-accent);
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 12px;
    overflow: hidden;
  }
  .viewport {
    width: 460px;
    max-width: 100%;
    height: min(760px, calc(100vh - 120px));
    border-radius: 14px;
    border: 1px dashed rgb(255 255 255 / 0.22);
    overflow: hidden;
    box-shadow: 0 20px 50px rgb(0 0 0 / 0.45);
    transition: width 0.2s ease;
  }
  .viewport--checker {
    background-color: #20232d;
    background-image:
      linear-gradient(45deg, #2b2f3d 25%, transparent 25%),
      linear-gradient(-45deg, #2b2f3d 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2b2f3d 75%),
      linear-gradient(-45deg, transparent 75%, #2b2f3d 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  .viewport--dark {
    background: #0d0e14;
  }
  .viewport--game {
    background:
      radial-gradient(circle at 20% 25%, #3b1d5e 0%, transparent 55%),
      radial-gradient(circle at 80% 75%, #124559 0%, transparent 55%),
      linear-gradient(135deg, #101426 0%, #1c1230 50%, #0d212b 100%);
  }
  .viewport--light {
    background: #edf1f7;
    border-color: rgb(0 0 0 / 0.18);
  }
  .viewport--pastel {
    background:
      radial-gradient(circle at 25% 20%, #ffd6e8 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, #cde8ff 0%, transparent 55%),
      linear-gradient(135deg, #fff4e8 0%, #f5e6ff 100%);
    border-color: rgb(0 0 0 / 0.14);
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    color-scheme: normal;
  }
  .hint {
    font-size: 12px;
    color: var(--ui-muted);
  }
</style>
</head>
<body>
<header class="bar" data-theme="" data-newest="bottom">
  <div class="title">
    <span>Overlay Preview</span>
    <span class="pill" id="theme-pill">Active theme</span>
  </div>
  <div class="group">
    <span class="group__label">Backdrop</span>
    <div class="seg" id="bg-seg">
      <button type="button" data-bg="checker" class="is-active">Checker</button>
      <button type="button" data-bg="dark">Dark</button>
      <button type="button" data-bg="game">Scene</button>
      <button type="button" data-bg="light">Light</button>
      <button type="button" data-bg="pastel">Pastel</button>
    </div>
  </div>
  <div class="group">
    <span class="group__label">Width</span>
    <div class="seg" id="width-seg">
      <button type="button" data-width="360">360px</button>
      <button type="button" data-width="460" class="is-active">460px</button>
      <button type="button" data-width="620">620px</button>
    </div>
  </div>
  <div class="group">
    <span class="group__label">Order</span>
    <div class="seg" id="order-seg">
      <button type="button" data-newest="bottom" class="is-active">Bottom</button>
      <button type="button" data-newest="top">Top</button>
    </div>
  </div>
  <div class="group">
    <span class="group__label">Feed</span>
    <div class="seg" id="feed-seg">
      <button type="button" data-demo="0" class="is-active">Showcase</button>
      <button type="button" data-demo="1">Live drip</button>
    </div>
  </div>
  <button type="button" class="action" id="replay-btn">Replay</button>
</header>
<main class="stage">
  <div class="viewport viewport--checker" id="viewport">
    <iframe id="frame" title="Chat overlay preview"></iframe>
  </div>
  <div class="hint">Changes in the Themes window update this preview live.</div>
</main>
<script>
"use strict";
(() => {
  const bar = document.querySelector(".bar");
  const pill = document.getElementById("theme-pill");
  const viewport = document.getElementById("viewport");
  const frame = document.getElementById("frame");

  const theme = bar.dataset.theme || "";
  if (theme) pill.textContent = theme;

  let newest = bar.dataset.newest === "top" ? "top" : "bottom";
  let demo = "0";
  let seq = 0;

  function setActive(container, selector) {
    for (const btn of container.querySelectorAll("button")) {
      btn.classList.toggle("is-active", btn.matches(selector));
    }
  }

  function loadFrame() {
    seq += 1;
    const params = new URLSearchParams();
    if (theme) params.set("theme", theme);
    params.set("newest", newest);
    if (demo === "1") params.set("demo", "1");
    params.set("_r", String(seq));
    frame.src = "preview/frame?" + params.toString();
  }

  const orderSeg = document.getElementById("order-seg");
  setActive(orderSeg, `[data-newest="${newest}"]`);

  document.getElementById("bg-seg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-bg]");
    if (!btn) return;
    viewport.className = "viewport viewport--" + btn.dataset.bg;
    setActive(e.currentTarget, `[data-bg="${btn.dataset.bg}"]`);
  });

  document.getElementById("width-seg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-width]");
    if (!btn) return;
    viewport.style.width = btn.dataset.width + "px";
    setActive(e.currentTarget, `[data-width="${btn.dataset.width}"]`);
  });

  orderSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-newest]");
    if (!btn) return;
    newest = btn.dataset.newest;
    setActive(orderSeg, `[data-newest="${newest}"]`);
    loadFrame();
  });

  document.getElementById("feed-seg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-demo]");
    if (!btn) return;
    demo = btn.dataset.demo;
    setActive(e.currentTarget, `[data-demo="${demo}"]`);
    loadFrame();
  });

  document.getElementById("replay-btn").addEventListener("click", loadFrame);

  loadFrame();
})();
</script>
</body>
</html>
