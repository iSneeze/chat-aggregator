<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat overlay</title>
<link rel="stylesheet" href="theme/overlay.css">
</head>
<body>
<main class="chat" role="log" aria-live="polite" data-newest="bottom" data-style-classes="" data-fonts-base="fonts/"></main>
<script>
"use strict";
// The server sends ready-rendered, escaped HTML for each message; this
// script only inserts messages, removes deleted ones, and applies live theme
// option updates. Styling is all in the theme's overlay.css. (Relative URLs,
// so the page also works under a subpath.)
(() => {
  const chat = document.querySelector(".chat");

  // Where the newest message goes: `?newest=top|bottom` in this page's URL
  // (one per OBS scene), otherwise the app's setting (`data-newest`, filled
  // in by the server).
  const param = new URLSearchParams(location.search).get("newest");
  const newestTop = (param === "top" || param === "bottom" ? param : chat.dataset.newest) === "top";
  if (newestTop) {
    // Flip the display, not the page order: messages are still added at
    // the end and the oldest removed first. Set here rather than only in
    // the theme, so themes made before this option work too.
    chat.classList.add("chat--newest-top");
    chat.style.flexDirection = "column-reverse";
  }
  // The box clips its overflow but still has a scroll position, which the
  // browser may move by itself ("scroll anchoring" keeps the old view in
  // place when content is added, which would push a new message at the top
  // out of view). Switch that off, and pin the view to the newest message
  // after every insert: asking for more than possible puts it at the edge,
  // whichever way the browser counts a reversed box's scroll position.
  chat.style.overflowAnchor = "none";
  function pinNewest() {
    chat.scrollTop = newestTop ? -chat.scrollHeight : chat.scrollHeight;
  }

  // "0.3s" / "300ms" -> milliseconds
  function parseDuration(value) {
    const v = value.trim();
    if (v.endsWith("ms")) return parseFloat(v) || 0;
    if (v.endsWith("s")) return (parseFloat(v) || 0) * 1000;
    return 0;
  }

  // Overlay settings are CSS variables, so streamers only ever edit CSS (or
  // tweak theme options in the app). Re-read when live style updates arrive.
  let maxMessages = 20;
  let deleteDelay = 0;
  function readBehaviorVars() {
    const style = getComputedStyle(document.documentElement);
    maxMessages = parseInt(style.getPropertyValue("--max-messages"), 10) || 20;
    deleteDelay = parseDuration(style.getPropertyValue("--delete-delay"));
  }
  readBehaviorVars();

  function trimMessages() {
    const shown = chat.querySelectorAll(".msg:not(.msg--deleted)");
    for (let i = 0; i < shown.length - maxMessages; i++) shown[i].remove();
  }

  // Load imported fonts on demand via the browser FontFace API so live SSE
  // style updates can switch to newly imported font files without a reload.
  const fontsBase = chat.dataset.fontsBase || "fonts/";
  const loadedFonts = new Map();
  function ensureFonts(fonts) {
    if (!Array.isArray(fonts) || !fonts.length || typeof FontFace === "undefined") return;
    for (const f of fonts) {
      if (!f || !f.family || !f.file || loadedFonts.has(f.family)) continue;
      const url = fontsBase + encodeURIComponent(f.file);
      const face = new FontFace(f.family, `url("${url}")`);
      const loading = face.load().then((loaded) => {
        document.fonts.add(loaded);
      }).catch(() => {
        loadedFonts.delete(f.family);
      });
      loadedFonts.set(f.family, loading);
    }
  }

  // Track vars and modifier classes controlled by theme options so live
  // updates and resets cleanly replace them without touching chat--newest-top.
  let appliedVars = new Set();
  let appliedClasses = new Set(
    (chat.dataset.styleClasses || "").split(" ").filter(Boolean)
  );
  function applyStyle(update) {
    ensureFonts(update && update.fonts);
    const rootStyle = document.documentElement.style;
    const nextVars = update && update.vars ? update.vars : {};
    for (const name of appliedVars) {
      if (!(name in nextVars)) rootStyle.removeProperty(name);
    }
    const nextAppliedVars = new Set();
    for (const [name, value] of Object.entries(nextVars)) {
      if (name.startsWith("--")) {
        rootStyle.setProperty(name, String(value));
        nextAppliedVars.add(name);
      }
    }
    appliedVars = nextAppliedVars;

    const nextClasses = new Set(update && Array.isArray(update.classes) ? update.classes : []);
    for (const cls of appliedClasses) {
      if (!nextClasses.has(cls)) chat.classList.remove(cls);
    }
    for (const cls of nextClasses) {
      chat.classList.add(cls);
    }
    appliedClasses = nextClasses;

    readBehaviorVars();
    trimMessages();
    pinNewest();
  }

  // Ids come from the platforms: escape them before putting them in a selector.
  const attr = (name, value) => `[${name}="${CSS.escape(String(value))}"]`;

  // Mark as deleted (CSS decides what that looks like), then remove after
  // --delete-delay so a CSS transition has time to play.
  function remove(selector) {
    for (const el of chat.querySelectorAll(selector)) {
      if (el.classList.contains("msg--deleted")) continue;
      el.classList.add("msg--deleted");
      setTimeout(() => el.remove(), deleteDelay);
    }
  }

  // This page's query goes along: `?theme=` picks the template too.
  const events = new EventSource("events" + location.search);

  // EventSource reconnects by itself, and on every (re)connect the server
  // replays its recent history. Start from a clean slate so nothing shows
  // twice: the history is the source of truth.
  events.addEventListener("open", () => chat.replaceChildren());

  events.addEventListener("chat", (e) => {
    chat.insertAdjacentHTML("beforeend", e.data);
    trimMessages();
    pinNewest();
  });

  events.addEventListener("style", (e) => {
    applyStyle(JSON.parse(e.data));
  });

  events.addEventListener("delete", (e) => {
    const d = JSON.parse(e.data);
    remove(`.msg${attr("data-platform", d.platform)}${attr("data-id", d.message_id)}`);
  });

  events.addEventListener("clear_user", (e) => {
    const d = JSON.parse(e.data);
    remove(`.msg${attr("data-platform", d.platform)}${attr("data-author", d.user_id)}`);
  });

  // The theme changed (e.g. from the app's settings): load the page again,
  // which fetches the new CSS and reconnects for the new template.
  events.addEventListener("reload", () => location.reload());

  events.addEventListener("clear_all", (e) => {
    const d = JSON.parse(e.data);
    remove(`.msg${attr("data-platform", d.platform)}`);
  });
})();
</script>
</body>
</html>
