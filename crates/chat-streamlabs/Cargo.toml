[package]
name = "chat-streamlabs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
# Streamlabs' Socket API is socket.io 2 (Engine.IO 3), which the Rust
# socket.io crates don't speak (they're on version 4): the little protocol
# on top of the WebSocket is done by hand.
chat-websocket = { path = "../chat-websocket" }
anyhow.workspace = true
jiff.workspace = true
# `sink`: the source writes to the socket too (Engine.IO 3's pings).
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
