[package]
name = "chat-streamlabs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
anyhow.workspace = true
jiff.workspace = true
# `sink`: the source writes to the socket too (Engine.IO 3's pings).
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Streamlabs' Socket API is socket.io 2 (Engine.IO 3), which the Rust
# socket.io crates don't speak (they're on version 4): the little protocol
# on top of the WebSocket is done by hand. Same WebSocket and TLS versions
# as chat-streamelements.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# `tls12`: sockets.streamlabs.com speaks only TLS 1.2 (seen 2026-11-07:
# ECDHE-RSA-AES128-GCM-SHA256), and without it rustls offers only 1.3.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
