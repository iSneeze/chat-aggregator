# chat-aggregator settings.
#
# Lines starting with # are comments. Remove the # in front of a setting to
# use it. Changes take effect the next time chat-aggregator starts.

[server]
# The overlay for OBS is at http://127.0.0.1:<port>/
port = 7878
# How many recent messages a (re)loaded overlay shows right away.
history = 20
# Overlay theme: the name of a folder in the "themes" folder next to this
# file, containing overlay.css and/or message.html (without it: built-in).
# theme = "my theme"
# When many messages arrive at once, show them this far apart (0 = off) ...
stagger_ms = 250
# ... but never delay a message by more than this (at most 5000).
stagger_max_ms = 2000
# The JSON API for your own programs (games, bots) at
# ws://127.0.0.1:<port>/api/v1/ws. Off unless you need it: any web page open
# in your browser could connect to it too.
api = false
# Where new messages appear in the overlay: "bottom" (the chat grows upward)
# or "top" (it grows downward). An overlay URL ending in ?newest=top or
# ?newest=bottom overrides this for that browser source.
newest = "bottom"

[youtube]
# Your own Google project's OAuth client, see
# https://isneeze.github.io/chat-aggregator/youtube-setup
# client_id = "1234567890-abc….apps.googleusercontent.com"
# client_secret = "GOCSPX-…"
# Only needed to read a video's chat by id without logging in:
# api_key = "…"
# Custom channel emoji, exported with scripts/yt-emoji-export.user.js:
# emojis = "/path/to/youtube-emojis.json"

[app]
# The desktop app's look: "system" (follows light/dark mode), "light",
# "dark" or "high-contrast". Headless mode ignores this.
appearance = "system"

# One [[sources]] block per chat to read. Add `enabled = false` to keep a
# source listed in the app but switched off.

# [[sources]]
# type = "twitch"
# channel = "your_channel"

# Your own YouTube broadcasts (needs the login: run with --youtube-login):
# [[sources]]
# type = "youtube"

# A specific YouTube video instead:
# [[sources]]
# type = "youtube"
# video_id = "VIDEO_ID"   # the part after watch?v= in the URL

# Sample messages of every kind, for trying out themes:
[[sources]]
type = "demo"
