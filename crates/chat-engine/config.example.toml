# chat-aggregator settings shared by all profiles.
#
# Lines starting with # are comments. Remove the # in front of a setting to
# use it. Changes take effect the next time chat-aggregator starts.
#
# A profile is a setup of its own: sources, overlay look, tips, chat
# reactions and widget settings, in a file in the "profiles" folder next to
# this one (profiles/<name>.toml, see profile.example.toml). The app
# switches between them. This file holds what all profiles share, and
# which profile is active:
profile = "Main"

[server]
# The overlay for OBS is at http://127.0.0.1:<port>/
port = 7878
# How many recent messages a (re)loaded overlay shows right away.
history = 20
# When many messages arrive at once, show them this far apart (0 = off) ...
stagger_ms = 250
# ... but never delay a message by more than this (at most 5000).
stagger_max_ms = 2000
# The JSON API for your own programs (games, bots) at
# ws://127.0.0.1:<port>/api/v1/ws. Off unless you need it. Programs on this
# computer, pages served from localhost and OBS browser sources (also "Local
# file" ones) can connect; web sites only if they're listed below.
api = false
# Web sites allowed to use the JSON API, e.g. a browser game. The app asks
# when a new one connects, and adds it here when you click "Allow".
# api_origins = ["https://game.example"]

[youtube]
# Your own Google project's OAuth client, see
# https://isneeze.github.io/chat-aggregator/youtube-setup
# client_id = "1234567890-abc….apps.googleusercontent.com"
# client_secret = "GOCSPX-…"
# Only needed to read a video's chat by id without logging in:
# api_key = "…"
# Channel emoji are learned from YouTube's web chat as they're used (kept
# in youtube-emojis/ next to this file); false switches that off:
learn_emojis = true
# All of a channel's emoji at once, exported with
# scripts/yt-emoji-export.user.js (optional):
# emojis = "/path/to/youtube-emojis.json"

# The connected channels, one block each. The app adds one at each login
# ("Connect YouTube", "Add channel") and removes it at "Log out"; the
# command-line login (--youtube-login) prints the block to add here. The
# login itself is in the system keyring, not in this file.
# [[youtube.accounts]]
# channel_id = "UC…"
# name = "your channel"

[app]
# The desktop app's look: "system" (follows light/dark mode), "light",
# "dark" or "high-contrast". Headless mode ignores this.
appearance = "system"
