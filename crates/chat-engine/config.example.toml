# chat-aggregator settings.
#
# Lines starting with # are comments. Remove the # in front of a setting to
# use it. Changes take effect the next time chat-aggregator starts.

[server]
# The overlay for OBS is at http://127.0.0.1:<port>/
port = 7878
# How many recent messages a (re)loaded overlay shows right away.
history = 20
# Overlay theme: "minimal" (built in: one line per message), or the name of
# a folder in the "themes" folder next to this file, containing overlay.css
# and/or message.html (without it: the built-in default). The full path of
# a theme folder elsewhere works too.
# theme = "my theme"
# When many messages arrive at once, show them this far apart (0 = off) ...
stagger_ms = 250
# ... but never delay a message by more than this (at most 5000).
stagger_max_ms = 2000
# The JSON API for your own programs (games, bots) at
# ws://127.0.0.1:<port>/api/v1/ws. Off unless you need it. Programs on this
# computer, pages served from localhost and OBS browser sources (also "Local
# file" ones) can connect; web sites only if they're listed below.
api = false
# Web sites allowed to use the JSON API, e.g. a browser game. The app asks
# when a new one connects, and adds it here when you click "Allow".
# api_origins = ["https://game.example"]
# Where new messages appear in the overlay: "bottom" (the chat grows upward)
# or "top" (it grows downward). An overlay URL ending in ?newest=top or
# ?newest=bottom overrides this for that browser source.
newest = "bottom"

[youtube]
# Your own Google project's OAuth client, see
# https://isneeze.github.io/chat-aggregator/youtube-setup
# client_id = "1234567890-abc….apps.googleusercontent.com"
# client_secret = "GOCSPX-…"
# Only needed to read a video's chat by id without logging in:
# api_key = "…"
# Channel emoji are learned from YouTube's web chat as they're used (kept
# in youtube-emojis/ next to this file); false switches that off:
learn_emojis = true
# All of a channel's emoji at once, exported with
# scripts/yt-emoji-export.user.js (optional):
# emojis = "/path/to/youtube-emojis.json"

[app]
# The desktop app's look: "system" (follows light/dark mode), "light",
# "dark" or "high-contrast". Headless mode ignores this.
appearance = "system"

# Chat reactions: chat makes things happen in other programs. Each rule has
# a trigger (which messages), optional guards (who, how often) and an
# action (what happens where). Chat only picks a rule: nothing a chatter
# writes is passed on. Demo messages never fire rules; the app's test
# messages do.
[reactions]
# true switches every rule off at once (outputs stay connected).
paused = false

# Warudo: in a blueprint, add an "On WebSocket Action" node; its Action is
# the name a rule sends. Connected only while a rule sends to it.
[reactions.warudo]
# Warudo's own default; another computer's address in a two-PC setup.
url = "ws://127.0.0.1:19190"
# How long a reaction may wait while Warudo can't be reached (not started
# yet, restarting), in seconds, up to 300. 0 drops it.
queue_secs = 0

# OBS: switch on "Enable WebSocket server" in OBS under Tools → WebSocket
# Server Settings. Connected only while a rule sends to it. The password
# (Show Connect Info there) isn't kept in this file but in your system's
# keyring: store it in the app's Reactions window (headless: `run
# --obs-password`).
[reactions.obs]
url = "ws://127.0.0.1:4455"
# As for Warudo.
queue_secs = 0

# One [[reactions.rules]] block per rule. Every matching rule fires.
#
# Triggers:
#   { type = "command", command = "!bonk" }   first word of a message, any case
#   { type = "keyword", keyword = "hype" }    a word or phrase anywhere, any case
#   { type = "emote", emote = "Kappa" }       a real emote (exact case)
#   { type = "paid" }                         bits, Super Chats, Super Stickers;
#   { type = "paid", min_tier = 4 }           ... of at least this tier
#   { type = "membership" }                   new subscriber/member, resub
#   { type = "gift", min_count = 5 }          gifted subs/memberships
# Guards (all optional):
#   min_role = "everyone" | "subscriber" (= "member") | "vip" | "moderator" | "broadcaster"
#   platforms = ["twitch", "youtube", "picarto"]   (default: all)
#   cooldown_secs = 10        the rule rests this long after firing
#   user_cooldown_secs = 60   ... and this long for the chatter who fired it
# Actions (names exactly as in OBS):
#   { target = "warudo", action = "throw_item" }
#   { target = "obs_filter", source = "Mic", filter = "Chipmunk", seconds = 30 }
#       a filter on for 30 s, then off again (without seconds: stays on);
#       firing again meanwhile makes it last longer
#   { target = "obs_source", scene = "Main", source = "Confetti", seconds = 5 }
#       a source shown for 5 s, then hidden again (without seconds: stays)
#   { target = "obs_media", source = "Airhorn" }
#       a media source played from the start
# Something that was already on before a reaction stays on afterwards.
#
# [[reactions.rules]]
# name = "bonk"
# trigger = { type = "command", command = "!bonk" }
# guards = { cooldown_secs = 10, user_cooldown_secs = 60 }
# action = { target = "warudo", action = "throw_item" }
#
# [[reactions.rules]]
# name = "chipmunk"
# trigger = { type = "paid", min_tier = 4 }
# guards = { cooldown_secs = 60 }
# action = { target = "obs_filter", source = "Mic", filter = "Chipmunk", seconds = 30 }

# One [[sources]] block per chat to read. Add `enabled = false` to keep a
# source listed in the app but switched off.

# [[sources]]
# type = "twitch"
# channel = "your_channel"

# Your own YouTube broadcasts (needs the login: run with --youtube-login):
# [[sources]]
# type = "youtube"

# A specific YouTube video instead:
# [[sources]]
# type = "youtube"
# video_id = "VIDEO_ID"   # the part after watch?v= in the URL

# A Picarto channel (its name, or the link to it):
# [[sources]]
# type = "picarto"
# channel = "your_channel"

# Sample messages of every kind, for trying out themes:
[[sources]]
type = "demo"
