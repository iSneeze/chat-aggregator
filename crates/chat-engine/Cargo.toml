[package]
name = "chat-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
chat-picarto = { path = "../chat-picarto" }
chat-reactions = { path = "../chat-reactions" }
chat-rplay = { path = "../chat-rplay" }
chat-server = { path = "../chat-server" }
chat-streamelements = { path = "../chat-streamelements" }
chat-streamlabs = { path = "../chat-streamlabs" }
chat-twitch = { path = "../chat-twitch" }
chat-youtube = { path = "../chat-youtube" }
anyhow.workspace = true
jiff.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[features]
# RPlay test builds: RPlay sources write their raw chat frames, chat
# included, to `rplay-capture.jsonl` next to `config.toml` (chat-rplay's
# `capture`). Never for a release.
rplay-capture = ["chat-rplay/capture"]

[dev-dependencies]
# Google's login endpoints stood in for, for the YouTube login tests.
chat-youtube = { path = "../chat-youtube", features = ["test-support"] }
# Paused, fast-forwarding clock for exact retry-timing tests; tests only.
tokio = { workspace = true, features = ["test-util"] }
reqwest.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
# A stand-in Warudo for the chat reactions test.
tokio-tungstenite.workspace = true
futures-util.workspace = true
webbrowser.workspace = true
