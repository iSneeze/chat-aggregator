[package]
name = "chat-twitch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# rustls instead of the default native-tls: one TLS library for the whole
# app, and no OpenSSL to link (or find on the user's machine) on Linux.
twitch-irc = { version = "6.1.1", default-features = false, features = ["transport-tcp-rustls-webpki-roots"] }
chat-core = { path = "../chat-core" }
tokio.workspace = true
anyhow.workspace = true
# twitch-irc hands out chrono timestamps; chat-core's are jiff's.
jiff.workspace = true
# Public GQL lookup for global + channel-specific Twitch badge icons.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
