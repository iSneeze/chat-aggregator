[package]
name = "chat-twitch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# rustls instead of the default native-tls: one TLS library for the whole
# app, and no OpenSSL to link (or find on the user's machine) on Linux.
twitch-irc = { version = "6.1.1", default-features = false, features = ["transport-tcp-rustls-webpki-roots"] }
# Only to choose rustls's crypto backend, see `TwitchSource::run`.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
chat-core = { path = "../chat-core" }
tokio.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Local timestamps in the raw_twitch example (already built for chat-core).
chrono.workspace = true
