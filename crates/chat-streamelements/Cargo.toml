[package]
name = "chat-streamelements"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
anyhow.workspace = true
jiff.workspace = true
# `sink`: the source writes to the socket too (the subscription).
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Astro, StreamElements' event gateway, is a plain WebSocket (wss://). Same
# versions as chat-rplay and chat-picarto.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"

[dev-dependencies]
# The raw_streamelements example: the channel lookup with a JWT, and
# reading the JWT's claims.
reqwest.workspace = true
base64.workspace = true
