[package]
name = "chat-streamelements"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
# Astro, StreamElements' event gateway, is a plain WebSocket (wss://).
chat-websocket = { path = "../chat-websocket" }
anyhow.workspace = true
jiff.workspace = true
# `sink`: the source writes to the socket too (the subscription).
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The raw_streamelements example: the channel lookup with a JWT, and
# reading the JWT's claims.
reqwest.workspace = true
base64.workspace = true
