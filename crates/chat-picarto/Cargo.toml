[package]
name = "chat-picarto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
# The chat is a plain WebSocket (wss://).
chat-websocket = { path = "../chat-websocket" }
anyhow.workspace = true
jiff.workspace = true
# `sink`: the source writes to the socket too (keepalive pings).
futures-util = { workspace = true, features = ["sink"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Reading the chat token's claims (a JWT) in the raw_picarto example.
base64.workspace = true
