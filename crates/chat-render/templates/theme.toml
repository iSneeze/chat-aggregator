# Customizable options for the Default built-in overlay theme.
# Custom theme folders can edit or replace this file to define their own
# controls in the app's Themes window.

[[options]]
name = "accent_mode"
label = "Accent style"
group = "Colors"
help = "By role colors the accent bar and role names for members/subs, mods, and broadcaster."
type = "choice"
default = "Platform"
options = ["Platform", "By role", "Custom"]
[options.class_values]
Platform = ""
"By role" = "chat--accent-role"
Custom = "chat--custom-accent"

[[options]]
name = "accent_color"
label = "Custom accent"
group = "Colors"
help = "Used in Custom mode, and for regular viewers in By role mode."
type = "color"
default = "#9146ff"
css_var = "--chat-accent"

[[options]]
name = "text_color"
label = "Text color"
group = "Colors"
type = "color"
default = "#f4f4f8"
css_var = "--chat-text"

[[options]]
name = "bg_color"
label = "Card color"
group = "Colors"
type = "color"
default = "#14141d"
css_var = "--chat-bg-color"

[[options]]
name = "bg_opacity"
label = "Card opacity"
group = "Colors"
help = "Set to 0% for floating text with no card background."
type = "number"
default = 78
min = 0
max = 100
step = 5
unit = "%"
css_var = "--chat-bg-opacity"

[[options]]
name = "member_color"
label = "Member / sub"
group = "Role colors"
help = "Subscribers, members, and VIPs when Accent style is By role."
type = "color"
default = "#2cb67d"
css_var = "--role-member"

[[options]]
name = "moderator_color"
label = "Moderator"
group = "Role colors"
type = "color"
default = "#5c8aff"
css_var = "--role-moderator"

[[options]]
name = "owner_color"
label = "Broadcaster"
group = "Role colors"
type = "color"
default = "#e53170"
css_var = "--role-owner"

[[options]]
name = "font"
label = "Font"
group = "Typography & layout"
type = "choice"
default = "Sans"
options = ["Sans", "Rounded", "Serif", "Monospace"]
css_var = "--chat-font"
[options.css_values]
Sans = '"Inter", "Segoe UI", system-ui, sans-serif'
Rounded = '"Nunito", "Quicksand", "Varela Round", ui-rounded, system-ui, sans-serif'
Serif = '"Georgia", "Cambria", ui-serif, serif'
Monospace = '"JetBrains Mono", "Cascadia Code", ui-monospace, monospace'

[[options]]
name = "font_size"
label = "Text size"
group = "Typography & layout"
type = "number"
default = 20
min = 12
max = 42
step = 1
unit = "px"
css_var = "--chat-font-size"

[[options]]
name = "corners"
label = "Corners"
group = "Typography & layout"
type = "choice"
default = "Rounded"
options = ["Sharp", "Rounded", "Pill"]
css_var = "--chat-radius"
[options.css_values]
Sharp = "4px"
Rounded = "12px"
Pill = "20px"

[[options]]
name = "spacing"
label = "Spacing"
group = "Typography & layout"
type = "choice"
default = "Cozy"
options = ["Compact", "Cozy", "Airy"]
css_var = "--chat-gap"
[options.css_values]
Compact = "4px"
Cozy = "8px"
Airy = "12px"
[options.class_values]
Compact = "chat--compact"
Cozy = ""
Airy = "chat--airy"

[[options]]
name = "animation"
label = "Entrance"
group = "Motion"
type = "choice"
default = "Slide"
options = ["Slide", "Fade", "Pop", "None"]
css_var = "--msg-enter"
[options.css_values]
Slide = "msg-in-slide 0.28s cubic-bezier(0.22, 1, 0.36, 1)"
Fade = "msg-in-fade 0.24s ease-out"
Pop = "msg-in-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)"
None = "none"

[[options]]
name = "fade_after"
label = "Fade out after"
group = "Motion"
help = "Hide older messages automatically after a while."
type = "choice"
default = "Never"
options = ["Never", "15s", "30s", "60s"]
css_var = "--msg-fade-delay"
[options.css_values]
Never = "0s"
15s = "15s"
30s = "30s"
60s = "60s"
[options.class_values]
Never = ""
15s = "chat--fade-out"
30s = "chat--fade-out"
60s = "chat--fade-out"

[[options]]
name = "show_timestamps"
label = "Timestamps"
group = "Elements"
type = "bool"
default = false
class = "chat--show-time"

[[options]]
name = "show_avatars"
label = "Avatars"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-avatars"

[[options]]
name = "show_badges"
label = "Badges"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-badges"

[[options]]
name = "show_platform"
label = "Platform dot"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-platform"

[[options]]
name = "show_accent_bar"
label = "Accent bar"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-accent"

[[options]]
name = "max_messages"
label = "Max messages"
group = "Elements"
help = "Older messages above this limit are removed."
type = "number"
default = 20
min = 5
max = 100
step = 5
css_var = "--max-messages"

