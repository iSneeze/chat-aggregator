# Customizable options for the Neon built-in overlay theme.

[[options]]
name = "accent_mode"
label = "Accent style"
group = "Colors"
help = "By role colors the HUD accent for members/subs, mods, and broadcaster; Chatter gives each chatter their own neon accent."
type = "choice"
default = "Custom"
options = ["Custom", "By role", "Chatter", "Platform"]
[options.class_values]
Custom = ""
"By role" = "chat--accent-role"
Chatter = "chat--accent-chatter"
Platform = "chat--accent-platform"

[[options]]
name = "accent_color"
label = "Primary neon"
group = "Colors"
help = "Main rail, glow, and author color in Custom mode (and for viewers in By role mode)."
type = "color"
default = "#00f0ff"
css_var = "--chat-accent"

[[options]]
name = "secondary_color"
label = "Secondary neon"
group = "Colors"
help = "Corner highlights, badges, and dual-tone accents."
type = "color"
default = "#ff2a85"
css_var = "--chat-secondary"

[[options]]
name = "bg_color"
label = "Panel color"
group = "Colors"
type = "color"
default = "#0b0d17"
css_var = "--chat-bg-color"

[[options]]
name = "text_color"
label = "Text color"
group = "Colors"
type = "color"
default = "#eef6ff"
css_var = "--chat-text"

[[options]]
name = "bg_opacity"
label = "Panel opacity"
group = "Colors"
type = "number"
default = 88
min = 0
max = 100
step = 5
unit = "%"
css_var = "--chat-bg-opacity"

[[options]]
name = "member_color"
label = "Member / sub"
group = "Role colors"
help = "Subscribers, members, and VIPs when Accent style is By role."
type = "color"
default = "#00f59b"
css_var = "--role-member"

[[options]]
name = "moderator_color"
label = "Moderator"
group = "Role colors"
type = "color"
default = "#7b61ff"
css_var = "--role-moderator"

[[options]]
name = "owner_color"
label = "Broadcaster"
group = "Role colors"
type = "color"
default = "#ff4785"
css_var = "--role-owner"

[[options]]
name = "frame"
label = "HUD style"
group = "Neon style"
type = "choice"
default = "Chamfered"
options = ["Chamfered", "Brackets", "Neon Tube", "Cyber Slash"]
[options.class_values]
Chamfered = ""
Brackets = "chat--frame-brackets"
"Neon Tube" = "chat--frame-tube"
"Cyber Slash" = "chat--frame-slash"

[[options]]
name = "glow"
label = "Glow intensity"
group = "Neon style"
type = "choice"
default = "Subtle"
options = ["Off", "Subtle", "Overdrive"]
[options.class_values]
Off = "chat--glow-off"
Subtle = ""
Overdrive = "chat--glow-overdrive"

[[options]]
name = "font"
label = "Font"
group = "Typography & layout"
type = "choice"
default = "Sans"
options = ["Sans", "Monospace", "Rounded", "Serif"]
css_var = "--chat-font"
[options.css_values]
Sans = '"Inter", "Segoe UI", system-ui, sans-serif'
Monospace = '"JetBrains Mono", "Cascadia Code", "Consolas", ui-monospace, monospace'
Rounded = '"Nunito", "Quicksand", "Varela Round", ui-rounded, system-ui, sans-serif'
Serif = '"Georgia", "Cambria", ui-serif, serif'

[[options]]
name = "font_size"
label = "Text size"
group = "Typography & layout"
type = "number"
default = 19
min = 12
max = 42
step = 1
unit = "px"
css_var = "--chat-font-size"

[[options]]
name = "spacing"
label = "Spacing"
group = "Typography & layout"
type = "choice"
default = "Cozy"
options = ["Compact", "Cozy", "Airy"]
css_var = "--chat-gap"
[options.css_values]
Compact = "6px"
Cozy = "10px"
Airy = "15px"
[options.class_values]
Compact = "chat--compact"
Cozy = ""
Airy = "chat--airy"

[[options]]
name = "animation"
label = "Entrance"
group = "Motion"
type = "choice"
default = "Glitch"
options = ["Glitch", "Slide", "Fade", "None"]
css_var = "--msg-enter"
[options.css_values]
Glitch = "msg-in-glitch 0.28s cubic-bezier(0.22, 1, 0.36, 1)"
Slide = "msg-in-slide 0.24s cubic-bezier(0.22, 1, 0.36, 1)"
Fade = "msg-in-fade 0.22s ease-out"
None = "none"

[[options]]
name = "fade_after"
label = "Fade out after"
group = "Motion"
help = "Hide older messages automatically after a while."
type = "choice"
default = "Never"
options = ["Never", "15s", "30s", "60s"]
css_var = "--msg-fade-delay"
[options.css_values]
Never = "0s"
15s = "15s"
30s = "30s"
60s = "60s"
[options.class_values]
Never = ""
15s = "chat--fade-out"
30s = "chat--fade-out"
60s = "chat--fade-out"

[[options]]
name = "show_timestamps"
label = "Timestamps"
group = "Elements"
type = "bool"
default = false
class = "chat--show-time"

[[options]]
name = "show_avatars"
label = "Avatars"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-avatars"

[[options]]
name = "show_badges"
label = "Badges"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-badges"

[[options]]
name = "show_platform"
label = "Platform tag"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-platform"

[[options]]
name = "max_messages"
label = "Max messages"
group = "Elements"
help = "Older messages above this limit are removed."
type = "number"
default = 20
min = 5
max = 100
step = 5
css_var = "--max-messages"

