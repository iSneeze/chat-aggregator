# Customizable options for the Retro built-in overlay theme.

[[options]]
name = "accent_mode"
label = "Accent style"
group = "Colors"
help = "Chatter mode gives every chatter their own nameplate color."
type = "choice"
default = "Custom"
options = ["Custom", "Chatter", "Platform"]
[options.class_values]
Custom = ""
Chatter = "chat--accent-chatter"
Platform = "chat--accent-platform"

[[options]]
name = "accent_color"
label = "Accent color"
group = "Colors"
help = "Speaker name, cursor, and frame highlight when Accent style is Custom."
type = "color"
default = "#ffd859"
css_var = "--chat-accent"

[[options]]
name = "bg_color"
label = "Window color"
group = "Colors"
type = "color"
default = "#132a6e"
css_var = "--chat-bg-color"

[[options]]
name = "text_color"
label = "Text color"
group = "Colors"
type = "color"
default = "#f5f7ff"
css_var = "--chat-text"

[[options]]
name = "bg_opacity"
label = "Window opacity"
group = "Colors"
type = "number"
default = 94
min = 0
max = 100
step = 5
unit = "%"
css_var = "--chat-bg-opacity"

[[options]]
name = "frame"
label = "Frame style"
group = "RPG style"
type = "choice"
default = "Classic RPG"
options = ["Classic RPG", "Pixel Bezel", "Handheld", "CRT", "Win95"]
[options.class_values]
"Classic RPG" = ""
"Pixel Bezel" = "chat--frame-pixel"
Handheld = "chat--frame-handheld"
CRT = "chat--frame-crt"
Win95 = "chat--frame-win95"

[[options]]
name = "scanlines"
label = "CRT scanlines"
group = "RPG style"
help = "Adds subtle horizontal scanlines over each dialogue box."
type = "bool"
default = false
class = "chat--scanlines"

[[options]]
name = "text_shadow"
label = "Pixel text shadow"
group = "RPG style"
help = "Turn off for crisp ink on light presets like Handheld or Parchment."
type = "bool"
default = true
css_var = "--retro-text-shadow"
[options.css_values]
true = "2px 2px 0 rgb(0 0 0 / 0.65)"
false = "none"

[[options]]
name = "show_cursor"
label = "Blinking cursor"
group = "RPG style"
help = "Shows a classic blinking advance arrow on the newest message."
type = "bool"
default = true
class_when_false = "chat--hide-cursor"

[[options]]
name = "font"
label = "Font"
group = "Typography & layout"
type = "choice"
default = "Monospace"
options = ["Monospace", "Arcade", "Serif", "Sans"]
css_var = "--chat-font"
[options.css_values]
Monospace = '"JetBrains Mono", "Cascadia Code", "Fira Code", "Consolas", ui-monospace, monospace'
Arcade = '"Silkscreen", "Press Start 2P", "VT323", "JetBrains Mono", ui-monospace, monospace'
Serif = '"Georgia", "Cambria", ui-serif, serif'
Sans = '"Inter", "Segoe UI", system-ui, sans-serif'

[[options]]
name = "font_size"
label = "Text size"
group = "Typography & layout"
type = "number"
default = 18
min = 12
max = 42
step = 1
unit = "px"
css_var = "--chat-font-size"

[[options]]
name = "spacing"
label = "Spacing"
group = "Typography & layout"
type = "choice"
default = "Cozy"
options = ["Compact", "Cozy", "Airy"]
css_var = "--chat-gap"
[options.css_values]
Compact = "6px"
Cozy = "10px"
Airy = "15px"
[options.class_values]
Compact = "chat--compact"
Cozy = ""
Airy = "chat--airy"

[[options]]
name = "animation"
label = "Entrance"
group = "Motion"
type = "choice"
default = "Snap"
options = ["Snap", "Slide", "Fade", "None"]
css_var = "--msg-enter"
[options.css_values]
Snap = "msg-in-snap 0.22s steps(4, end)"
Slide = "msg-in-slide 0.24s ease-out"
Fade = "msg-in-fade 0.2s ease-out"
None = "none"

[[options]]
name = "fade_after"
label = "Fade out after"
group = "Motion"
help = "Hide older messages automatically after a while."
type = "choice"
default = "Never"
options = ["Never", "15s", "30s", "60s"]
css_var = "--msg-fade-delay"
[options.css_values]
Never = "0s"
15s = "15s"
30s = "30s"
60s = "60s"
[options.class_values]
Never = ""
15s = "chat--fade-out"
30s = "chat--fade-out"
60s = "chat--fade-out"

[[options]]
name = "show_timestamps"
label = "Timestamps"
group = "Elements"
type = "bool"
default = false
class = "chat--show-time"

[[options]]
name = "show_avatars"
label = "Portraits"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-avatars"

[[options]]
name = "show_badges"
label = "Badges"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-badges"

[[options]]
name = "show_platform"
label = "Platform square"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-platform"

[[options]]
name = "max_messages"
label = "Max messages"
group = "Elements"
help = "Older messages above this limit are removed."
type = "number"
default = 20
min = 5
max = 100
step = 5
css_var = "--max-messages"

