# Customizable options for the Cozy built-in overlay theme.

[[options]]
name = "accent_mode"
label = "Accent style"
group = "Colors"
help = "By role colors the card accent for members/subs, mods, and broadcaster; Chatter gives each chatter their own color."
type = "choice"
default = "Custom"
options = ["Custom", "By role", "Chatter", "Platform"]
[options.class_values]
Custom = ""
"By role" = "chat--accent-role"
Chatter = "chat--accent-chatter"
Platform = "chat--accent-platform"

[[options]]
name = "accent_color"
label = "Accent color"
group = "Colors"
help = "Charms, names, border, and shadow tint in Custom mode (and for viewers in By role mode)."
type = "color"
default = "#c95475"
css_var = "--chat-accent"

[[options]]
name = "bg_color"
label = "Card color"
group = "Colors"
type = "color"
default = "#fff7f5"
css_var = "--chat-bg-color"

[[options]]
name = "text_color"
label = "Text color"
group = "Colors"
type = "color"
default = "#4a2c35"
css_var = "--chat-text"

[[options]]
name = "bg_opacity"
label = "Card opacity"
group = "Colors"
type = "number"
default = 96
min = 0
max = 100
step = 5
unit = "%"
css_var = "--chat-bg-opacity"

[[options]]
name = "member_color"
label = "Member / sub"
group = "Role colors"
help = "Subscribers, members, and VIPs when Accent style is By role."
type = "color"
default = "#3b996b"
css_var = "--role-member"

[[options]]
name = "moderator_color"
label = "Moderator"
group = "Role colors"
type = "color"
default = "#5a74d6"
css_var = "--role-moderator"

[[options]]
name = "owner_color"
label = "Broadcaster"
group = "Role colors"
type = "color"
default = "#d46a2e"
css_var = "--role-owner"

[[options]]
name = "frame"
label = "Frame style"
group = "Card style"
type = "choice"
default = "Stitched"
options = ["Stitched", "Sticker", "Soft", "Notebook"]
[options.class_values]
Stitched = ""
Sticker = "chat--frame-sticker"
Soft = "chat--frame-soft"
Notebook = "chat--frame-notebook"

[[options]]
name = "tilt"
label = "Card tilt"
group = "Card style"
help = "Gives each note card a tiny hand-placed angle."
type = "choice"
default = "Subtle"
options = ["None", "Subtle", "Playful"]
[options.class_values]
None = "chat--tilt-none"
Subtle = ""
Playful = "chat--tilt-playful"

[[options]]
name = "corners"
label = "Corners"
group = "Card style"
type = "choice"
default = "Rounded"
options = ["Soft", "Rounded", "Plush"]
css_var = "--chat-radius"
[options.css_values]
Soft = "10px"
Rounded = "16px"
Plush = "24px"

[[options]]
name = "font"
label = "Font"
group = "Typography & layout"
type = "font"
default = "Rounded"
options = ["Rounded", "Serif", "Sans", "Monospace"]
css_var = "--chat-font"
[options.css_values]
Rounded = '"Nunito", "Quicksand", "Varela Round", ui-rounded, "Segoe UI", system-ui, sans-serif'
Serif = '"Georgia", "Cambria", ui-serif, serif'
Sans = '"Inter", "Segoe UI", system-ui, sans-serif'
Monospace = '"JetBrains Mono", "Cascadia Code", ui-monospace, monospace'

[[options]]
name = "font_size"
label = "Text size"
group = "Typography & layout"
type = "number"
default = 19
min = 12
max = 42
step = 1
unit = "px"
css_var = "--chat-font-size"

[[options]]
name = "spacing"
label = "Spacing"
group = "Typography & layout"
type = "choice"
default = "Cozy"
options = ["Compact", "Cozy", "Airy"]
css_var = "--chat-gap"
[options.css_values]
Compact = "7px"
Cozy = "11px"
Airy = "16px"
[options.class_values]
Compact = "chat--compact"
Cozy = ""
Airy = "chat--airy"

[[options]]
name = "animation"
label = "Entrance"
group = "Motion"
type = "choice"
default = "Float"
options = ["Float", "Pop", "Fade", "None"]
css_var = "--msg-enter"
[options.css_values]
Float = "msg-in-float 0.32s cubic-bezier(0.22, 1, 0.36, 1)"
Pop = "msg-in-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)"
Fade = "msg-in-fade 0.24s ease-out"
None = "none"

[[options]]
name = "fade_after"
label = "Fade out after"
group = "Motion"
help = "Hide older messages automatically after a while."
type = "choice"
default = "Never"
options = ["Never", "15s", "30s", "60s"]
css_var = "--msg-fade-delay"
[options.css_values]
Never = "0s"
15s = "15s"
30s = "30s"
60s = "60s"
[options.class_values]
Never = ""
15s = "chat--fade-out"
30s = "chat--fade-out"
60s = "chat--fade-out"

[[options]]
name = "show_charms"
label = "Chatter charms"
group = "Elements"
help = "A persistent sparkle, heart, star, blossom, leaf, or moon per chatter."
type = "bool"
default = true
class_when_false = "chat--hide-charms"

[[options]]
name = "show_timestamps"
label = "Timestamps"
group = "Elements"
type = "bool"
default = false
class = "chat--show-time"

[[options]]
name = "show_avatars"
label = "Avatars"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-avatars"

[[options]]
name = "show_badges"
label = "Badges"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-badges"

[[options]]
name = "show_platform"
label = "Platform dot"
group = "Elements"
type = "bool"
default = true
class_when_false = "chat--hide-platform"

[[options]]
name = "max_messages"
label = "Max messages"
group = "Elements"
help = "Older messages above this limit are removed."
type = "number"
default = 20
min = 5
max = 100
step = 5
css_var = "--max-messages"

