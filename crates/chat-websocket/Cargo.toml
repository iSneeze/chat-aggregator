[package]
name = "chat-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
anyhow.workspace = true
futures-util.workspace = true
tokio.workspace = true
tracing.workspace = true
# The sources reach tungstenite through this crate's re-export, so they all
# use the same version without listing it themselves.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# `tls12`: sockets.streamlabs.com speaks only TLS 1.2 (seen 2026-11-07:
# ECDHE-RSA-AES128-GCM-SHA256), and without it rustls offers only 1.3.
rustls = { workspace = true, features = ["tls12"] }
webpki-roots = "1"

[dev-dependencies]
# Paused, fast-forwarding clock for exact timing tests (`start_paused`):
# the reconnect waits are minutes long.
tokio = { workspace = true, features = ["test-util"] }
