[package]
name = "chat-youtube"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
tonic = { version = "0.13", features = ["tls-ring", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
serde.workspace = true
reqwest.workspace = true
chrono.workspace = true
# Midnight in Los Angeles (incl. daylight saving) = when YouTube quota resets.
chrono-tz.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
# OAuth login (loopback flow): the callback server, the OAuth protocol
# (without its own HTTP client; we plug in our reqwest), token storage in the
# OS keyring, and the per-OS config dir for the keyring-less fallback.
axum.workspace = true
oauth2.workspace = true
keyring.workspace = true
directories.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
# The examples open the login page; the library leaves that to the caller.
webbrowser.workspace = true

[build-dependencies]
tonic-build = "0.13"
