[package]
name = "chat-youtube"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chat-core = { path = "../chat-core" }
tonic = { version = "0.13", features = ["tls-ring", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
serde.workspace = true
reqwest.workspace = true
jiff.workspace = true
tokio.workspace = true
# Stops the web chat reader when its broadcast's chat is left.
tokio-util.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
# OAuth login (loopback flow): the callback server and the OAuth protocol
# (without its own HTTP client; we plug in our reqwest). The token is kept
# with chat-core's `secrets`.
axum.workspace = true
oauth2.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
# Tests stand in for YouTube's gRPC endpoint, which speaks HTTP/2.
axum = { workspace = true, features = ["http2"] }
futures-util.workspace = true
# The examples open the login page; the library leaves that to the caller.
webbrowser.workspace = true

[build-dependencies]
tonic-build = "0.13"
